baseURL = "https://KenzyTran.github.io/hera/"
title = "Hera — AWS Voice Agent Workshop"
theme = "hugo-theme-learn"

# Hugo serves the site under the /hera/ subdir but Markdown image refs use
# absolute paths like `/images/x.png` -- without this flag the browser hits
# `/images/x.png` (404) instead of `/hera/images/x.png`. canonifyURLs rewrites
# all absolute paths at build time so they include the baseURL prefix.
canonifyURLs = true

defaultContentLanguage = "vi"
defaultContentLanguageInSubdir = true

[languages]
  [languages.vi]
    languageName = "Tiếng Việt"
    contentDir = "content/vi"
    weight = 1
    languageCode = "vi"
    title = "Hera — Workshop Voice Agent trên AWS"
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 2
    languageCode = "en"
    title = "Hera — AWS Voice Agent Workshop"

[params]
  description = "FCJ workshop deploying a bilingual voice agent on Amazon Bedrock AgentCore Runtime + Nova 2 Sonic."
  author = "AWS Cloud Clubs Vietnam"
  showVisitedLinks = false
  disableBreadcrumb = false
  disableNextPrev = false
  disableLandingPageButton = true
  themeVariant = "workshop"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
