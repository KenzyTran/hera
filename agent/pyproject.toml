[project]
name = "hera-agent"
version = "0.1.0"
description = "Pipecat voice agent for the Hera workshop. Talks to Amazon Nova 2 Sonic via Bedrock and looks up Apple products in the Phase 1 KB."
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[aws-nova-sonic,silero,websocket]==1.2.1",
    "boto3",
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]",
    "watchtower>=3.3,<4",
    "aws-opentelemetry-distro>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hera_agent"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff",
    "websockets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
