[project]
name = "hera-agentcore-cdk"
version = "0.1.0"
description = "Hera Phase 3 AgentCore Runtime stack (CDK Python)."
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.0.0",
    # boto3 is only used at synth time to read terraform outputs JSON. No runtime deps.
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hera_agentcore"]
