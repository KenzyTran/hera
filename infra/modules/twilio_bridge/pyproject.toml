[project]
name = "hera-twilio-bridge"
version = "0.1.0"
description = "Twilio Media Streams <-> Bedrock AgentCore Runtime bridge. Phase 6 — D-56 App Runner with min-instances=0."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]",
    "websockets>=15",
    "audioop-lts==0.2.2",
    "boto3",
    "botocore",
    "twilio>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
